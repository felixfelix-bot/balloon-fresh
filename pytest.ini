[pytest]
markers =
    unit: Unit tests (no hardware required, fast)
    hardware: Hardware integration tests (requires RP2040 boards connected)
    simulate: Hardware-free simulation tests (mock serial backend, no boards)
    asyncio: Coroutine tests driven by firmware/e80-stm32-bench/tools/conftest.py
        (the tools/ suite declares no async plugin dependency)
testpaths = tests
addopts = -v --tb=short
# Only ``test_*.py`` modules are pytest test modules here.
#
# This repo also carries standalone ``*_test.py`` *lab scripts* rather than
# tests: tests/lora_rpi_test.py and tests/throughput-matrix/uart_id_test.py /
# uart_rx_test.py drive openocd and serial ports at **import** time (no test
# functions, no fixtures). Collecting them aborts the whole run with
# FileNotFoundError (missing openocd) / SerialException (no board), exactly the
# class of defect the p1b_ab_test.py exclusion fixed in tests/conftest.py.
# They belong to the balloon-e80bench bench, so they are simply not collected.
# (The hyphen in ``throughput-matrix`` is irrelevant: with the default import
# mode pytest imports those modules by basename, not as a package.)
python_files = test_*.py
