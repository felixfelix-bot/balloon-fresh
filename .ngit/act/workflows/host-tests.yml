name: Host Unit Tests (ngit)

# ngit-CI port of .github/workflows/ci-host-tests.yml.
# Same five suite commands, same order. Deliberately identical so one harness
# fix serves both engines; git-workflow triggers map under ngit-ci as
# push / pull_request (pr/ branches).

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          if ! command -v cc >/dev/null 2>&1 || [ ! -f /usr/include/mbedtls/ssl.h ] || [ ! -f /usr/include/cjson/cJSON.h ]; then
            SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO=sudo
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq gcc g++ make libmbedtls-dev libcjson-dev
          fi

      # ── Suite 1: nostr_store (7 tests) ──────────────────────────
      - name: Build & run nostr_store tests
        run: |
          cd tracker/firmware/components/nostr_store
          cc -Wall -Wextra -O2 -I include \
            -o /tmp/test_nostr_store \
            nostr_store.c test/test_nostr_store.c
          /tmp/test_nostr_store

      # ── Suite 2: relay-pipeline (12 tests) ───────────────────────
      - name: Build & run relay pipeline tests
        run: |
          cd tracker/firmware
          gcc -Wall -O2 -I main -I components/nostr_store/include \
            -o /tmp/test_relay_pipeline \
            main/test/test_relay_pipeline.c \
            main/tollgate_payment_proto.c \
            components/nostr_store/nostr_store.c
          /tmp/test_relay_pipeline

      # ── Suite 3: tollgate (~350 tests across 13 binaries) ───────
      - name: Build & run tollgate unit tests
        run: |
          cd mesh-stack/tollgate/tests/unit
          make clean
          make
          make test

      # ── Suite 4: ehash-relay (65 tests) ─────────────────────────
      - name: Build & run ehash-relay tests
        run: |
          cd mesh-stack/ehash-relay
          gcc -std=c11 -Wall -I include/ -I ../protocol/ \
            test/test_ehash_relay.c \
            ehash_relay.c \
            ehash_crypto.c \
            ehash_messages.c \
            ehash_upstream.c \
            ehash_radio_stub.c \
            -o /tmp/test_relay
          /tmp/test_relay

      # ── Suite 5: stratorelay (11 tests) ─────────────────────────
      - name: Build & run stratorelay tests
        run: |
          g++ -std=c++17 -Wall \
            -I tracker/firmware/components/stratorelay \
            tracker/firmware/components/stratorelay/test/test_stratorelay.cpp \
            -o /tmp/test_stratorelay
          /tmp/test_stratorelay

      # ── Suite 6: FLRC BT0.5 cross-platform parity (12 tests) ────
      # P0.5 (t_dc858d9b): proves the RP2040 and ESP32 FLRC bench firmware
      # program the same pulse shape (BT0.5 => 0x25), which is what makes a
      # raw-FLRC ESP32<->RP2040 link possible at all. Host-side only: it
      # asserts the register bytes emitted, no boards needed.
      - name: Run FLRC BT0.5 parity tests
        run: |
          # PEP 668: the act container's python3 is externally managed, so a
          # plain `pip install` exits 1 there and took the WHOLE lane down
          # (observed on d3a3b45a, 2026-09-29: "Failure - Main Run FLRC BT0.5
          # parity tests").  Prefer a normal install, fall back to the
          # documented override, and fail loudly if pytest still is not there.
          python3 -m pip install --quiet pytest \
            || python3 -m pip install --quiet --break-system-packages pytest
          python3 -m pytest tests/test_flrc_bt05_parity.py -v --tb=short

      # ── Suite 7: ESP32-C3 <-> RP2040 UART telemetry protocol (115) ─
      # t_79ae3ee7: the wire protocol between the two MCUs — frame format,
      # CRC-16/CCITT-FALSE, payload round-trips, decoder re-synchronisation
      # after noise, corruption/truncation handling and the sanity validators.
      # Host-side only (no ESP-IDF / Pico-SDK headers), no boards needed.
      - name: Build & run UART telemetry protocol tests
        run: |
          cd tracker/firmware/components/uart_telemetry/test
          make clean
          make
          make test

      # ── Suite 8: ESP32-C3 TX hot-loop P0.2 invariants (16 tests) ──────
      # t_19807e87: locks the P0.2 remediation. Asserts the timeout-recovery
      # branch clears the sticky error register UNCONDITIONALLY (the old
      # `irqStatus & 0x00030000` guard could never fire once rfClearIrq() had
      # dropped the error IRQ flags), clears the IRQ latch, records the failing
      # packet's IRQ/DIO9, and that the machine-parseable TX_DONE_STATS burst
      # summary + per-250 progress line are present. Also asserts the happy path
      # still carries no per-packet CLR_ERRORS/CLR_TX_FIFO, so the P0.2 win
      # cannot be silently undone — the region it inspects is brace-matched and
      # asserted to span the WHOLE loop, after round-1 review found the first
      # revision's lazy `.*?` stopped at the poll's inner brace (16 tests).
      # Host-side only, no boards needed.
      - name: Run ESP32-C3 TX hot-loop P0.2 invariant tests
        run: |
          python3 -m pip install --quiet pytest \
            || python3 -m pip install --quiet --break-system-packages pytest
          python3 -m pytest tests/test_c3_tx_hotloop_p02.py -v --tb=short
