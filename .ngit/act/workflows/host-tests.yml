name: Host Unit Tests (ngit)

# ngit-CI port of .github/workflows/ci-host-tests.yml.
# Same five suite commands, same order. Deliberately identical so one harness
# fix serves both engines; git-workflow triggers map under ngit-ci as
# push / pull_request (pr/ branches).

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          if ! command -v cc >/dev/null 2>&1 || [ ! -f /usr/include/mbedtls/ssl.h ] || [ ! -f /usr/include/cjson/cJSON.h ]; then
            SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO=sudo
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq gcc g++ make libmbedtls-dev libcjson-dev
          fi

      # ── Suite 1: nostr_store (7 tests) ──────────────────────────
      - name: Build & run nostr_store tests
        run: |
          cd tracker/firmware/components/nostr_store
          cc -Wall -Wextra -O2 -I include \
            -o /tmp/test_nostr_store \
            nostr_store.c test/test_nostr_store.c
          /tmp/test_nostr_store

      # ── Suite 2: relay-pipeline (12 tests) ───────────────────────
      - name: Build & run relay pipeline tests
        run: |
          cd tracker/firmware
          gcc -Wall -O2 -I main -I components/nostr_store/include \
            -o /tmp/test_relay_pipeline \
            main/test/test_relay_pipeline.c \
            main/tollgate_payment_proto.c \
            components/nostr_store/nostr_store.c
          /tmp/test_relay_pipeline

      # ── Suite 3: tollgate (~350 tests across 13 binaries) ───────
      - name: Build & run tracker tollgate proto tests
        run: |
          cd tracker/firmware
          gcc -Wall -O2 -I main -I components/nostr_store/include \
            -o /tmp/test_tollgate_payment_proto \
            main/test/test_tollgate_payment_proto.c \
            main/tollgate_payment_proto.c
          /tmp/test_tollgate_payment_proto

      # ── Suite 2c: PAY→ACK harness log parser (17 tests, host-only) ─
      # Regression guard for the D6 false-negative/false-positive defects:
      # `seq=%u` parsing, TRACKER-tag/telemetry false positives, seq 0, the
      # whitespace-only `seq 9` form (t_24d9e30c), the sibling
      # `session_id 5` / `price 10 sats` / `expires 99` forms (t_2a65361e), and
      # the session NAME union `session=%u` / `session_id 5` (t_388122d0).
      - name: Run PAY→ACK harness parser regression tests
        run: |
          cd tracker/firmware
          python3 test/test_tollgate_payack_parse.py

      # ── Suite 3: tollgate (~350 tests across 13 binaries) ───────
      - name: Build & run tollgate unit tests
        run: |
          cd mesh-stack/tollgate/tests/unit
          make clean
          make
          make test

      # ── Suite 4: ehash-relay (65 tests) ─────────────────────────
      - name: Build & run ehash-relay tests
        run: |
          cd mesh-stack/ehash-relay
          gcc -std=c11 -Wall -I include/ -I ../protocol/ \
            test/test_ehash_relay.c \
            ehash_relay.c \
            ehash_crypto.c \
            ehash_messages.c \
            ehash_upstream.c \
            ehash_radio_stub.c \
            -o /tmp/test_relay
          /tmp/test_relay

      # ── Suite 5: stratorelay (11 tests) ─────────────────────────
      - name: Build & run stratorelay tests
        run: |
          g++ -std=c++17 -Wall \
            -I tracker/firmware/components/stratorelay \
            tracker/firmware/components/stratorelay/test/test_stratorelay.cpp \
            -o /tmp/test_stratorelay
          /tmp/test_stratorelay

      # ── Suite 6: FLRC BT0.5 cross-platform parity (12 tests) ────
      # P0.5 (t_dc858d9b): proves the RP2040 and ESP32 FLRC bench firmware
      # program the same pulse shape (BT0.5 => 0x25), which is what makes a
      # raw-FLRC ESP32<->RP2040 link possible at all. Host-side only: it
      # asserts the register bytes emitted, no boards needed.
      - name: Run FLRC BT0.5 parity tests
        run: |
          # PEP 668: the act container's python3 is externally managed, so a
          # plain `pip install` exits 1 there and took the WHOLE lane down
          # (observed on d3a3b45a, 2026-09-29: "Failure - Main Run FLRC BT0.5
          # parity tests").  Prefer a normal install, fall back to the
          # documented override, and fail loudly if pytest still is not there.
          python3 -m pip install --quiet pytest \
            || python3 -m pip install --quiet --break-system-packages pytest
          python3 -m pytest tests/test_flrc_bt05_parity.py -v --tb=short

      # ── Suite 8: power_manager supercap-monitoring guard (V1 + V2) ──
      # Gate 1/2 evidence for t_807f52d4: the ADC path is compiled out on V1
      # (no free ADC pin; ADC1_CH0 = GPIO0 = GPS TX). This runs BOTH sides of
      # the #ifdef so the contract is proven in each direction — the V1 build
      # asserts the out-of-range sentinel (a literal 0 would assert LOW_POWER),
      # the V2 build asserts failed-init retry / failed-read sentinel. The
      # legacy raw_to_mv suite is still compiled and run.
      - name: Build & run power_manager guard tests (V1 + V2)
        run: |
          cd tracker/firmware/components/power_manager
          gcc -Wall -Wextra -O2 -I . -I test/stubs -I ../../../../tests/host_stubs -o /tmp/test_pm_legacy test/test_power_manager.c
          /tmp/test_pm_legacy
          gcc -Wall -Wextra -O2 -I . -I test/stubs -I ../../../../tests/host_stubs -o /tmp/test_pm_v1 test/test_power_manager_guard.c
          /tmp/test_pm_v1
          gcc -Wall -Wextra -O2 -DSUPERCAP_MONITORING \
            -I . -I test/stubs -I ../../../../tests/host_stubs -o /tmp/test_pm_v2 test/test_power_manager_guard.c
          /tmp/test_pm_v2

      # ── Suite 7: ESP32-C3 <-> RP2040 UART telemetry protocol (115) ─
      # t_79ae3ee7: the wire protocol between the two MCUs — frame format,
      # CRC-16/CCITT-FALSE, payload round-trips, decoder re-synchronisation
      # after noise, corruption/truncation handling and the sanity validators.
      # Host-side only (no ESP-IDF / Pico-SDK headers), no boards needed.
      - name: Build & run UART telemetry protocol tests
        run: |
          cd tracker/firmware/components/uart_telemetry/test
          make clean
          make
          make test

      # ── Suite 8: PCB auto-route pipeline gates (t_80d91470) ──────
      # The PCB-V2 Phase 1 card's five quality gates, expressed as
      # assertions so they cannot silently rot (a previous run reported
      # "zone=0" against a file containing two `zone` hits in prose).
      # The static gates run anywhere.  The behavioural gates need
      # pcbnew (KiCad) and self-skip on a container without it.
      - name: Run PCB pipeline gate tests
        run: |
          python3 -m pip install --quiet pytest \
            || python3 -m pip install --quiet --break-system-packages pytest
          python3 -m pytest tests/test_pcb_pipeline_gates.py -v --tb=short

      # ── Suite 9: auto-BOOTSEL interposer board (t_48a0fa82) ───────
      # The interposer PCB's 28 assertions.  The netlist, orientation,
      # mass-model, reproducibility and vendored-footprint checks run
      # anywhere; every kicad-cli-dependent check (the fab DRC gate, Gate 2.5
      # on the unrouted placement, and the negative controls that drive DRC)
      # self-skips when kicad-cli is absent, which is the case in the stock act
      # image — hence the explicit skip line, so a green lane is never mistaken
      # for "the DRC gate ran here".
      #
      # HISTORY (778d662 → b7599e1): "run anywhere" was FALSE.  The generator
      # read its library footprints from /usr/share/kicad/footprints, so on
      # this image eleven tests ERRORED at fixture setup and the lane was RED.
      # The footprints are now vendored in-repo; the counts below are from an
      # actual act-image run (15 passed / 13 skipped), not from a host run.
      - name: Run auto-BOOTSEL board tests
        run: |
          python3 -m pip install --quiet pytest \
            || python3 -m pip install --quiet --break-system-packages pytest
          if command -v kicad-cli >/dev/null 2>&1; then
            echo "kicad-cli present: the DRC + Gate 2.5 checks will run"
          else
            echo "SKIP: kicad-cli absent - the DRC/Gate 2.5 checks are skipped"
            echo "      by their own skipif; netlist/orientation/mass checks run"
            echo "      EXPECTED HERE: no failed, no errors (they were 2 failed /"
            echo "      9 errors at 778d662 because regeneration needed KiCad)"
          fi
          python3 -m pytest \
            tracker/hardware/auto_bootsel/tests/test_auto_bootsel_pcb.py \
            -v --tb=short

      # ── Suite 9: PCB Phase 1 track-import spec (t_877751ec) ──────
      # The import defect that cost 181 track_dangling violations: a hand-rolled
      # DSN parser with no Y inversion and no degenerate-segment collapse.  The
      # spec pins the coordinate transform against the board's own footprints,
      # the collapse threshold against the DSN's length histogram, and prefers
      # KiCad's ImportSpecctraSES over the DSN parser.  The DSN half runs
      # anywhere; the board-level half self-skips without pcbnew.
      - name: Run PCB track-import spec
        run: |
          python3 -m pip install --quiet pytest \
            || python3 -m pip install --quiet --break-system-packages pytest
          python3 -m pytest tests/test_pcb_track_import.py -v --tb=short
