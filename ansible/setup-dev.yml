---
# setup-dev.yml — Balloon RF developer environment setup
#
# Installs ALL dependencies needed to run the balloon-fresh Makefile targets
# on a fresh Ubuntu/Debian machine (Felix's T470 ThinkPad, DQ05, etc.).
#
# Usage:
#   ansible-playbook ansible/setup-dev.yml --ask-become-pass
#   # remote host:
#   ansible-playbook ansible/setup-dev.yml -i HOST, -u USER --ask-become-pass
#
# Idempotent: safe to run multiple times. Only changed items are reported.

- name: Balloon RF — developer environment setup (Ubuntu/Debian)
  hosts: localhost
  connection: local
  gather_facts: true
  become: false            # escalate only where needed (apt, udev)

  vars:
    # System packages (apt)
    balloon_apt_packages:
      - python3
      - python3-pip
      - python3-venv
      - git
      - git-lfs
      - usbutils           # lsusb  → make find-ports
      - udev               # udevadm → make find-ports, flash-*
      - coreutils          # stty, cat, cut, awk → make monitor-*, bootsel-1200
      - util-linux         # lsblk, mount → make bootsel-1200
      - curl               # general utility / bootstrap

    # Python packages (pip --user)
    balloon_pip_packages:
      - platformio         # build + flash → make build-*, flash-*
      - pyserial           # serial comms → make flash-*, sync-time, walk-test
      - pytest             # tests → make test, test-unit

  tasks:

    # ─── 0. Sanity: confirm Debian/Ubuntu family ────────────────────────
    - name: Assert target is Debian/Ubuntu family
      ansible.builtin.assert:
        that: ansible_os_family == "Debian"
        fail_msg: >-
          This playbook targets Ubuntu/Debian (ansible_os_family == "Debian").
          Detected '{{ ansible_os_family }}'. Aborting — adapt the apt tasks
          for your package manager.

    # ─── 1. System packages via apt ─────────────────────────────────────
    - name: Update apt cache
      become: true
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600   # only refresh if older than 1h

    - name: Install system packages
      become: true
      ansible.builtin.apt:
        name: "{{ balloon_apt_packages }}"
        state: present

    # picotool — optional, for UF2 BOOTSEL flashing + PlatformIO upload_protocol=picotool
    # Available via apt on Ubuntu 23.04+ / Debian 13+. Try; ignore if absent.
    - name: Try to install picotool from apt (optional)
      become: true
      ansible.builtin.apt:
        name: picotool
        state: present
      register: picotool_apt
      failed_when: false
      changed_when: >-
        picotool_apt.rc is defined and picotool_apt.rc == 0
        and ('installed' in (picotool_apt.stdout | default('')) | lower
             or picotool_apt.changed | default(false))

    # ─── 2. Python packages via pip (user install, PEP 668 safe) ────────
    # PIP_BREAK_SYSTEM_PACKAGES=1 is silently ignored by old pip and bypasses
    # the "externally-managed-environment" guard on Ubuntu 23.04+ / Debian 12+.
    - name: Install balloon Python packages (user)
      ansible.builtin.pip:
        name: "{{ balloon_pip_packages }}"
        state: present
        extra_args: "--user"
      environment:
        PIP_BREAK_SYSTEM_PACKAGES: "1"

    # ─── 3. udev rules for RP2040 boards ────────────────────────────────
    # Uses the existing repo rules: tools/99-balloon-boards.rules
    # Creates /dev/balloon-tx and /dev/balloon-rx symlinks + MODE=0666.
    - name: Install RP2040 udev rules
      become: true
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../tools/99-balloon-boards.rules"
        dest: /etc/udev/rules.d/99-balloon-boards.rules
        owner: root
        group: root
        mode: "0644"
        backup: true
      notify: Reload udev rules

    - name: Flush handlers (apply udev rules now if changed)
      ansible.builtin.meta: flush_handlers

    - name: Trigger udev to apply rules to existing devices
      become: true
      ansible.builtin.command: udevadm trigger
      changed_when: false

    # ─── 4. Ensure ~/.local/bin is on PATH for pio / pytest ─────────────
    - name: Ensure ~/.profile has ~/.local/bin on PATH
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/.profile"
        regexp: '\.local/bin'
        line: 'export PATH="$HOME/.local/bin:$PATH"'
        create: true
        state: present

    # ─── 5. Verification ────────────────────────────────────────────────
    - name: Verify PlatformIO
      ansible.builtin.command: "{{ ansible_env.HOME }}/.local/bin/pio --version"
      register: pio_check
      changed_when: false

    - name: Verify pyserial
      ansible.builtin.command: >-
        python3 -c "import serial; print('pyserial', serial.__version__)"
      register: serial_check
      changed_when: false

    - name: Verify pytest
      ansible.builtin.command: "{{ ansible_env.HOME }}/.local/bin/pytest --version"
      register: pytest_check
      changed_when: false

    # ─── 6. Summary ─────────────────────────────────────────────────────
    - name: Print verification summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "  Balloon RF dev environment — setup complete"
          - "============================================================"
          - "PlatformIO : {{ pio_check.stdout | default(pio_check.stderr) | trim }}"
          - "pyserial   : {{ serial_check.stdout | default(serial_check.stderr) | trim }}"
          - "pytest     : {{ (pytest_check.stdout ~ pytest_check.stderr) | trim }}"
          - "picotool   : {{ 'installed via apt' if (picotool_apt.rc | default(1)) == 0 else 'not in apt (optional)' }}"
          - "udev rules : /etc/udev/rules.d/99-balloon-boards.rules"
          - ""
          - "Next steps:"
          - "  1. Log out and back in (or: source ~/.profile) for PATH"
          - "  2. make find-ports   # verify boards are detected"
          - "  3. make test-unit    # run unit tests (no hardware needed)"
          - "  4. make build-all    # build TX + RX firmware"
          - "============================================================"

  handlers:

    - name: Reload udev rules
      become: true
      ansible.builtin.command: udevadm control --reload-rules
      changed_when: false
