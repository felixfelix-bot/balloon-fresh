# ansible/range-inventory.ini — E80 distributed range test hosts
#
# Two machines:
#   T470 (CobradorWave): i7-7600U, 7GB RAM, Ubuntu 26.04, openocd installed
#   DQ05  (c03rad0r-DQ05proplus): Intel N95, 10GB RAM, pyserial installed
#
# Both machines have avahi-daemon active (.local mDNS names).
# SSH between machines works in lab; may not during field testing.
#
# Usage:
#   ansible-playbook -i ansible/range-inventory.ini ansible/range-setup.yml

[t470]
t470 ansible_host=cobradorwave.local ansible_user=c03rad0r

[dq05]
dq05 ansible_host=c03rad0r-dq05proplus.local ansible_user=c03rad0r

[e80_range:children]
t470
dq05

[e80_range:vars]
# These are defaults; override on command line if needed.
# ansible_python_interpreter=/usr/bin/python3
