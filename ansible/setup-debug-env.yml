---
# Ansible playbook: Install logic analyzer debugging dependencies
# Installs sigrok-cli, picotool (with Pico SDK), PlatformIO CLI,
# Max Gerhardt platform fork + earlephilhower Arduino core, udev rules.
#
# Run: ansible-playbook ansible/setup-debug-env.yml -K
#
# LEARNINGS baked in:
#   1. No global become: true (causes sudo prompt timeout on Gathering Facts)
#   2. picotool needs PICO_SDK_PATH (clone pico-sdk first, pass via cmake)
#   3. Official PIO raspberrypi platform does NOT support board_build.core=earlephilhower
#      Must use Max Gerhardt's fork: github.com/maxgerhardt/platform-raspberrypi
#   4. earlephilhower framework-arduinopico must be cloned with --recursive (submodules)
#   5. tool-picotool-rp2040-earlephilhower needed for upload_protocol=picotool

- name: Set up logic analyzer debugging environment
  hosts: localhost
  connection: local
  vars:
    local_user: "{{ lookup('env', 'USER') }}"
    pio_install_dir: "/home/{{ local_user }}/.platformio"
    pio_packages: "/home/{{ local_user }}/.platformio/packages"
    pico_sdk_dir: "/home/{{ local_user }}/pico-sdk"

  tasks:
    # ── Package prerequisites ────────────────────────────────────────────
    - name: Install apt prerequisites
      become: true
      ansible.builtin.apt:
        name:
          - build-essential
          - cmake
          - git
          - python3
          - python3-pip
          - python3-venv
          - pkg-config
          - libglib2.0-dev
          - libserialport-dev
          - libusb-1.0-0-dev
          - libftdi1-dev
          - libhidapi-dev
          - libzip-dev
          - udev
        state: present
        update_cache: true

    # ── sigrok suite ──────────────────────────────────────────────────────
    - name: Install sigrok-cli and libsigrok
      become: true
      ansible.builtin.apt:
        name:
          - sigrok
          - sigrok-cli
          - libsigrok-dev
          - libsigrok4
        state: present

    - name: Install pulseview (optional GUI)
      become: true
      ansible.builtin.apt:
        name:
          - pulseview
          - libsigrokdecode-dev
        state: present
      ignore_errors: true
      register: pulseview_install

    - name: Report pulseview status
      ansible.builtin.debug:
        msg: >-
          pulseview {{ 'installed' if pulseview_install.changed | default(false) else 'already installed or unavailable' }}
      when: pulseview_install is defined

    # ── picotool (needs Pico SDK) ────────────────────────────────────────
    - name: Check if picotool is already installed
      ansible.builtin.command: which picotool
      register: picotool_check
      changed_when: false
      failed_when: false

    - name: Clone Pico SDK (required by picotool build)
      ansible.builtin.git:
        repo: https://github.com/raspberrypi/pico-sdk.git
        dest: "{{ pico_sdk_dir }}"
        depth: 1
      when: picotool_check.rc != 0

    - name: Init Pico SDK submodules
      ansible.builtin.command:
        cmd: "git submodule update --init"
        chdir: "{{ pico_sdk_dir }}"
      when: picotool_check.rc != 0

    - name: Clone picotool repository
      ansible.builtin.git:
        repo: https://github.com/raspberrypi/picotool.git
        dest: /tmp/picotool
        depth: 1
        force: true
      when: picotool_check.rc != 0

    - name: Build and install picotool (with PICO_SDK_PATH)
      become: true
      ansible.builtin.shell: |
        cd /tmp/picotool
        rm -rf build && mkdir build && cd build
        cmake .. -DPICO_SDK_PATH={{ pico_sdk_dir }}
        make -j$(nproc)
        make install
      when: picotool_check.rc != 0

    # ── PlatformIO CLI ───────────────────────────────────────────────────
    - name: Check if PlatformIO is installed
      ansible.builtin.command: which pio
      register: pio_check
      changed_when: false
      failed_when: false

    - name: Create PlatformIO venv
      ansible.builtin.command:
        cmd: "python3 -m venv {{ pio_install_dir }}/penv"
        creates: "{{ pio_install_dir }}/penv/bin/python"
      when: pio_check.rc != 0

    - name: Install PlatformIO CLI
      ansible.builtin.command: "{{ pio_install_dir }}/penv/bin/pip install platformio"
      when: pio_check.rc != 0

    - name: Create pio symlink in /usr/local/bin
      become: true
      ansible.builtin.file:
        src: "{{ pio_install_dir }}/penv/bin/pio"
        dest: /usr/local/bin/pio
        state: link
        force: true
      when: pio_check.rc != 0

    # ── Max Gerhardt platform fork (NOT official PIO platform) ───────────
    # The official PIO raspberrypi platform (v1.20.0) does NOT support
    # board_build.core=earlephilhower. Max Gerhardt's fork does.
    # Without this, builds fail with "Arduino.h: No such file or directory".
    - name: Check if Max Gerhardt platform is installed
      ansible.builtin.stat:
        path: "{{ pio_install_dir }}/platforms/raspberrypi/.git"
      register: pico_platform_check

    - name: Install Max Gerhardt platform-raspberrypi fork
      ansible.builtin.command:
        cmd: "pio platform install https://github.com/maxgerhardt/platform-raspberrypi.git"
      when: not pico_platform_check.stat.exists
      ignore_errors: true

    - name: Verify Max Gerhardt platform version (should be 1.19.x fork)
      ansible.builtin.shell: |
        grep -o 'maxgerhardt' {{ pio_install_dir }}/platforms/raspberrypi/platform.json 2>/dev/null || \
        cat {{ pio_install_dir }}/platforms/raspberrypi/platform.json | head -3
      register: platform_version
      changed_when: false

    - name: Warn if official platform detected (not the fork)
      ansible.builtin.debug:
        msg: >-
          WARNING: Max Gerhardt fork not detected. If builds fail with
          "Arduino.h: No such file or directory", run manually:
          pio platform install https://github.com/maxgerhardt/platform-raspberrypi.git
      when: "'maxgerhardt' not in platform_version.stdout"

    # ── earlephilhower Arduino-Pico framework ────────────────────────────
    # Must be cloned with --recursive (pico-sdk, FreeRTOS, TinyUSB submodules)
    - name: Check if earlephilhower framework is installed
      ansible.builtin.stat:
        path: "{{ pio_packages }}/framework-arduinopico/cores/rp2040/Arduino.h"
      register: framework_check

    - name: Clone earlephilhower arduino-pico framework (with submodules)
      ansible.builtin.git:
        repo: https://github.com/earlephilhower/arduino-pico.git
        dest: "{{ pio_packages }}/framework-arduinopico"
        depth: 1
        recursive: true
      when: not framework_check.stat.exists

    - name: Check if earlephilhower picotool package is installed
      ansible.builtin.stat:
        path: "{{ pio_packages }}/tool-picotool-rp2040-earlephilhower/.git"
      register: pico_tool_check

    - name: Clone earlephilhower picotool (for upload_protocol=picotool)
      ansible.builtin.git:
        repo: https://github.com/earlephilhower/picotool.git
        dest: "{{ pio_packages }}/tool-picotool-rp2040-earlephilhower"
        depth: 1
      when: not pico_tool_check.stat.exists

    # ── udev rules ───────────────────────────────────────────────────────
    - name: Install RP2040 udev rules (BOOTSEL + CDC + app mode)
      become: true
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/99-picotool.rules
        mode: "0644"
        content: |
          # Raspberry Pi Pico (RP2040) BOOTSEL mode — picotool access
          SUBSYSTEM=="usb", ATTRS{idVendor}=="2e8a", ATTRS{idProduct}=="0003", MODE="0666", GROUP="plugdev"
          # RP2040 app mode (CDC)
          SUBSYSTEM=="usb", ATTRS{idVendor}=="2e8a", ATTRS{idProduct}=="000a", MODE="0666", GROUP="plugdev"
          # RP2040 MicroPython
          SUBSYSTEM=="usb", ATTRS{idVendor}=="2e8a", ATTRS{idProduct}=="0009", MODE="0666", GROUP="plugdev"
      notify: Reload udev

    - name: Install logic analyzer udev rules
      become: true
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/99-logic-analyzer.rules
        mode: "0644"
        content: |
          # fx2lafw-compatible USB logic analyzers (Saleae Logic / Cellulologic etc.)
          # Saleae Logic
          SUBSYSTEM=="usb", ATTRS{idVendor}=="0925", ATTRS{idProduct}=="3881", MODE="0666", GROUP="plugdev"
          # Cypress FX2 generic
          SUBSYSTEM=="usb", ATTRS{idVendor}=="0547", ATTRS{idProduct}=="1002", MODE="0666", GROUP="plugdev"
          # CWAV USBee
          SUBSYSTEM=="usb", ATTRS{idVendor}=="08a9", ATTRS{idProduct}=="0014", MODE="0666", GROUP="plugdev"
          # Cellulologic 8-channel 24MHz (typically uses generic VID:PID matching fx2lafw)
          SUBSYSTEM=="usb", ATTRS{idVendor}=="1d50", ATTRS{idProduct}=="6086", MODE="0666", GROUP="plugdev"
      notify: Reload udev

    # ── Verify all tools ─────────────────────────────────────────────────
    - name: Verify sigrok-cli
      ansible.builtin.command: sigrok-cli --version
      register: sigrok_ver
      changed_when: false

    - name: Verify picotool
      ansible.builtin.command: picotool version
      register: picotool_ver
      changed_when: false
      ignore_errors: true

    - name: Verify PlatformIO
      ansible.builtin.command: pio --version
      register: pio_ver
      changed_when: false

    - name: Verify pulseview (if installed)
      ansible.builtin.command: pulseview --version
      register: pulseview_ver
      changed_when: false
      ignore_errors: true

    - name: Verify earlephilhower framework
      ansible.builtin.stat:
        path: "{{ pio_packages }}/framework-arduinopico/cores/rp2040/Arduino.h"
      register: fw_verify

    - name: Print tool versions
      ansible.builtin.debug:
        msg:
          - "=== Installed tool versions ==="
          - "sigrok-cli: {{ sigrok_ver.stdout_lines[0] | default('unknown') }}"
          - "picotool: {{ picotool_ver.stdout_lines[0] | default('unknown') }}"
          - "PlatformIO: {{ pio_ver.stdout | default('unknown') }}"
          - "pulseview: {{ pulseview_ver.stdout_lines[0] | default('not installed') }}"
          - "earlephilhower Arduino.h: {{ 'OK' if fw_verify.stat.exists else 'MISSING' }}"
          - "Pico SDK: {{ pico_sdk_dir }}"
          - "=============================="
          - "Next: cd to repo and run 'make debug ENV=rp2040-raw-tx DURATION=1 OUTPUT=captures/test.sr'"

  handlers:
    - name: Reload udev
      become: true
      ansible.builtin.shell: udevadm control --reload-rules && udevadm trigger