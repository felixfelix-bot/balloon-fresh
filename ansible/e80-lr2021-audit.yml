---
# Provision a host to run the LR2021 receive-only bench audit, then run it.
# Idempotent. Never opens the board it does not find, never transmits.
#
#   ansible-playbook -i localhost, -c local ansible/e80-lr2021-audit.yml \
#       -e port=/dev/ttyUSB0
#
- name: E80 / LR2021 receive-only bench audit
  hosts: all
  gather_facts: true
  vars:
    port: /dev/ttyUSB0
    repo_root: "{{ playbook_dir }}/.."
    ch340_pattern: "1a86:7523"
  tasks:
    - name: Install pyserial
      ansible.builtin.pip:
        name: pyserial
        state: present
      become: "{{ ansible_facts.user_id != 'root' }}"

    - name: Verify a CH340 (E80 console) is attached
      ansible.builtin.shell:
        cmd: set -o pipefail; lsusb | grep -q '{{ ch340_pattern }}'
      args:
        executable: /bin/bash
      register: ch340
      changed_when: false
      failed_when: false

    - name: Warn when no CH340 is present
      ansible.builtin.debug:
        msg: >-
          No CH340 ({{ ch340_pattern }}) found on {{ inventory_hostname }}.
          The audit will still run and report '(no response)' for each command
          rather than a false pass.
      when: ch340.rc != 0

    - name: Confirm the requested port exists
      ansible.builtin.stat:
        path: "{{ port }}"
      register: port_stat

    - name: Fail if the requested port is absent
      ansible.builtin.fail:
        msg: "{{ port }} does not exist on {{ inventory_hostname }}"
      when: not port_stat.stat.exists

    - name: Check the port is not held by another process
      ansible.builtin.shell:
        cmd: fuser {{ port }} 2>/dev/null | wc -l
      args:
        executable: /bin/bash
      register: holders
      changed_when: false

    - name: Warn when another process holds the port
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ holders.stdout }} process(es) hold {{ port }}. Concurrent
          access corrupts console responses. Stop them first.
      when: holders.stdout | int > 0

    - name: Create the audit output directory
      ansible.builtin.file:
        path: "{{ repo_root }}/firmware/e80-stm32-bench/tools/lr2021/out"
        state: directory
        mode: "0755"

    - name: Run the LR2021 receive-only audit
      ansible.builtin.command:
        cmd: >-
          python3 {{ repo_root }}/firmware/e80-stm32-bench/tools/lr2021/e80_lr2021_audit.py
          --port {{ port }}
          --out {{ repo_root }}/firmware/e80-stm32-bench/tools/lr2021/out/lr2021-audit.json
          --log {{ repo_root }}/firmware/e80-stm32-bench/tools/lr2021/out/lr2021-audit.console.log
      register: audit
      changed_when: true

    - name: Show the audit tail
      ansible.builtin.debug:
        msg: "{{ audit.stdout_lines[-12:] }}"
