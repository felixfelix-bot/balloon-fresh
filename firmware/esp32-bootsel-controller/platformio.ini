; PlatformIO project: ESP32-C3 RP2040 BOOTSEL/RUN Controller (test firmware)
;
; Wiring (DIRECT WIRE, NO SERIES RESISTORS):
;   GPIO1 (D1) -> RP2040 RUN button pad (3V3 signal side)
;   GPIO8 (D8) -> RP2040 GP0 / BOOTSEL button pad (3V3 signal side)
;   GND        -> RP2040 GND
;
; Environments:
;   esp32c3      — interactive controller (r=reset b=bootsel s=status), default
;   esp32c3-diag — GPIO diagnostic: toggles the pins at visible rates for a
;                  multimeter check of the soldered pads
;   esp32c3-loop — blind loop trigger: full BOOTSEL sequence every 5 s, for
;                  recovering an RP2040 whose USB CDC is dead
;
; Do NOT set -DARDUINO_USB_MODE=1 / -DARDUINO_USB_CDC_ON_BOOT=1: on the
; ESP32-C3 SuperMini (303a:1001) that breaks the console outright. The command
; path is the hardware UART (Serial1) for exactly that reason.
;
; Build & flash:
;   pio run -e esp32c3
;   python3 -m esptool --port /dev/ttyACMX --chip esp32c3 --baud 460800 \
;     --before default_reset --after hard_reset write_flash 0x0 \
;     .pio/build/esp32c3/firmware.bin

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 460800
monitor_speed = 115200
build_src_filter = +<main.cpp> +<bootsel_controller.cpp> -<bootsel_diag.cpp> -<bootsel_loop.cpp>
build_flags =
    -O2
    -Wall
    -Wextra

; Diagnostic: toggle GPIO pins at visible rates for multimeter testing
[env:esp32c3-diag]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 460800
monitor_speed = 115200
build_src_filter = -<*> +<bootsel_diag.cpp>
build_flags =
    -O2
    -Wall
    -Wextra

; Blind loop trigger: full sequence every 5 s, no host input required
[env:esp32c3-loop]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 460800
monitor_speed = 115200
build_src_filter = -<*> +<bootsel_loop.cpp>
build_flags =
    -O2
    -Wall
    -Wextra
