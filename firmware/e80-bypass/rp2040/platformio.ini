; PlatformIO project — E80-900MBL-02 SPI-bypass firmware, RP2040 Pico host
;
; Builds on the proven firmware/rp2040 env template (maxgerhardt platform fork,
; earlephilhower core, picotool upload) with the E80 wiring-doc pin map.
;
;   Build only (this repo standard — do NOT flash from CI):
;     pio run -e e80_rp2040          # FLRC-650 TX/RX bench (single image)
;     pio run -e e80_rp2040_diag     # chip diagnostic
;   Flash (bench, on the bench host only):
;     pio run -e e80_rp2040 -t upload --upload-port /dev/ttyACMX
;     pio device monitor -p /dev/ttyACMX -b 115200
;
; SPI clocks: jumper-harness guidance from E80-SPI-BYPASS-WIRING.md §7.5 —
; bring-up at 1 MHz (diag), bench default 4 MHz (raise only after clean reads).

[platformio]
default_envs = e80_rp2040

[env:e80_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
build_src_filter = -<*> +<e80_flrc_bench.cpp>
build_flags =
    -D SERIAL_BAUD=115200
    -D E80_SPI_HZ=4000000UL
    -I ../common
    -O2
    -Wall
lib_deps =
upload_protocol = picotool
monitor_speed = 115200

[env:e80_rp2040_diag]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
build_src_filter = -<*> +<e80_chip_diag.cpp>
build_flags =
    -D SERIAL_BAUD=115200
    -D E80_SPI_HZ=1000000UL
    -I ../common
    -O2
    -Wall
lib_deps =
upload_protocol = picotool
monitor_speed = 115200
