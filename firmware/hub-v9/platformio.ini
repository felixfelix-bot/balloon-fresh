; PlatformIO project: HUB V9 — flight carrier firmware (ESP32-S3-WROOM-1U)
;
; This is the FLIGHT build target: LR2021 F33 module (868 MHz link) on SPI0,
; SX1280 (2.4 GHz FLRC + ranging) on SPI1, MAX-M10S GNSS on UART1.
;
; ── Pin authority ────────────────────────────────────────────────────────────
; Docs/COEXISTENCE-V9.md §4 "Pin plan" is the design of record. The firmware
; does NOT re-invent pins: platformio.ini passes them as PIN_* macros and
; src/pin_plan.h checks them against the table on the first build. If the
; netlist and this file disagree, the build fails loudly instead of flying wrong.
;
;   function   SPI0 / LR2021    SPI1 / SX1280
;   SCK        GPIO12           GPIO36
;   MOSI       GPIO11           GPIO35
;   MISO       GPIO13           GPIO37
;   NSS        GPIO10           GPIO38
;   BUSY       GPIO9            GPIO39
;   RST        GPIO8            GPIO40
;   DIO/IRQ    GPIO7            GPIO41
;   GNSS UART  GPIO17 (RX) / GPIO18 (TX), PPS GPIO21
;
; ── Board variant (IMPORTANT) ────────────────────────────────────────────────
; v9 populates the **WROOM-1U** (U.FL / external antenna). `esp32-s3-devkitc-1`
; is a stand-in board definition: same silicon and flash geometry; the Arduino
; board selection affects boot/flash defaults, never the GPIO matrix. Prefer a
; WROOM-1U definition if the installed platform ships one.
;
; ── Build / flash ────────────────────────────────────────────────────────────
;   pio run -e hub_v9
;   pio run -e hub_v9 -t upload
;   pio device monitor -b 115200
;   make -C firmware/lib test          # host tests, no hardware
;
; ── Deliberate limits ────────────────────────────────────────────────────────
; * RECEIVE-ONLY. No TX arm exists here, on purpose: the operator's bring-up
;   order is receive-only until a link closes (2026-10-14). Do not add one.
; * There is no radio driver yet. This env exists so the flight target BUILDS
;   and the pin plan is machine-checked; the drivers land through the
;   firmware/lib modules (L0 radio_core + L2/L3/L4).

[platformio]
default_envs = hub_v9

[env:hub_v9]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200

; Pin table in ONE place. src/pin_plan.h asserts these against the documented
; GPIO budget, so a wrong pin is a compile error, not a silent miswire.
build_flags =
    -D HUB_V9=1
    -D SERIAL_BAUD=115200
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D PIN_LR2021_SCK=12
    -D PIN_LR2021_MOSI=11
    -D PIN_LR2021_MISO=13
    -D PIN_LR2021_NSS=10
    -D PIN_LR2021_BUSY=9
    -D PIN_LR2021_RST=8
    -D PIN_LR2021_DIO=7
    -D PIN_SX1280_SCK=36
    -D PIN_SX1280_MOSI=35
    -D PIN_SX1280_MISO=37
    -D PIN_SX1280_NSS=38
    -D PIN_SX1280_BUSY=39
    -D PIN_SX1280_RST=40
    -D PIN_SX1280_DIO=41
    -D PIN_GNSS_RX=17
    -D PIN_GNSS_TX=18
    -D PIN_GNSS_PPS=21
    -D PIN_STATUS_LED=48
    -I firmware/lib
    -O2
    -Wall
    -Wextra

lib_deps =
    ; RadioLib covers the SX128x family and the LR2021 family. Pinned to a major
    ; line so a flight build cannot drift underneath us.
    jgromes/RadioLib@^7.0.0

test_ignore = test_*
