; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = rp2040

[env:rp2040]
platform = raspberrypi
board = pico
framework = arduino
build_flags = 
	-D RP2040
	-D SERIAL_BAUD=115200
	-O2
	-Wall
lib_deps = 
	jgromes/RadioLib @ ^7.6.0
upload_protocol = picotool
monitor_speed = 115200

[env:rp2040-flrc-rx]
platform = raspberrypi
board = pico
framework = arduino
board_build.core = earlephilhower
build_src_filter = +<flrc_rx_main.cpp> -<main.cpp> -<radio.cpp>
; NOTE: no -D RP2040 here — the earlephilhower core declares `class RP2040`
; (RP2040Support.h) and a RP2040 macro breaks its headers. Use
; ARDUINO_ARCH_RP2040 (defined by the core) for platform checks.
build_flags = 
	-D SERIAL_BAUD=115200
	-O2
	-Wall
lib_deps = jgromes/RadioLib@^7.6.0
upload_protocol = picotool
monitor_speed = 115200
