<text x="1120" y="502" font-size="14" text-anchor="middle" fill="#b45309">433 Yagi (LoRa downlink) ~12–15 dBi / 40–50° beam</text>
<text x="1120" y="524" font-size="12" text-anchor="middle" fill="#475569">beside the aperture → blockage ≈ 0.1 dB</text>
<rect x="1100" y="520" width="80" height="16" fill="#334155"/>
<line x1="1140" y1="450" x2="1140" y2="520" stroke="#334155" stroke-width="4"/>
<text x="1140" y="560" font-size="14" text-anchor="middle">az/el positioner</text>
<rect x="975" y="575" width="470" height="0" fill="none"/>
<text x="24" y="900" font-size="17" font-weight="bold" fill="#111">Verdict: LoRa → any antenna closes (req gain negative, 12–28 dB margin). FLRC → needs a dish (+9…+28 dBi).</text>
<text x="24" y="926" font-size="17" font-weight="bold" fill="#b91c1c">The ONLY case that breaks the architecture: FLRC at 650 km with TX ≤ +19 dBm (433 antenna must be a ~2.7–3.0 m dish, not a Yagi).</text>
