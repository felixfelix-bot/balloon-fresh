<text x="30" y="68" fill="#9aa4b2" font-family="DejaVu Sans, sans-serif" font-size="14">PA can replace 2.4 GHz TX antenna gain (EIRP, 1:1); an LNA cannot replace 433 RX gain (cascade cap ~6.4 dB).</text>
