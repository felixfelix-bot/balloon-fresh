    <script nonce="RLGLcdpQxeVxjJhBnACIJA==">
    jQuery(window).on('load', function() {
        setSelect2();
        setCopyrightYear();
        setFocus();
        changeLoginHtml();
    });
    function setSelect2()
    {
      if(jQuery('select[name="domain"]').length > 0)
      {
        jQuery('select[name="domain"]').select2();
      }
      if(jQuery('select[name="dname"]').length > 0)
      {
        jQuery('select[name="dname  "]').select2();
      }
      if(jQuery('select[name="authtype"]').length > 0)
      {
        jQuery('select[name="authtype"]').select2();
      }
    }

    function setFocus() {
       if(document.login !== null && !$('#loading-form').length > 0) {
        document.login.j_username.focus();
      }
    }
    //SD 44904 Method to set Copyright Year in Login page
    function setCopyrightYear(){
      var copyrightContent = document.getElementById("copyrightinfo"); //No I18N
      if(copyrightContent!=null){
        document.getElementById("copyrightinfo").textContent = copyrightContent.textContent.replace("{{copyright_year}}",(new Date).getFullYear()); //NO OUTPUTENCODING
      }
    }

    var is_origin_included = 'false';
    var origin = "";
    if(is_origin_included == "true"){
      origin = 'null';
      window.top.postMessage( (typeof sdpToJSON != 'undefined') ? sdpToJSON({"type" : "is_sdp_logged_in", "message" : "false","showSamlLocalChoice":true}) : JSON.stringify({"type" : "is_sdp_logged_in", "message" : "false","showSamlLocalChoice":true}) , origin); //No I18N
    } else if(window.location.href.includes("is_from_external_chat")) {     // No I18N
      window.top.postMessage(JSON.stringify({"type": "disable_ext_chat", "message": "Check if the external website is added in security settings."}) ,'null');// No I18N
    }

    function changeLoginHtml(){
      var is_from_external_chat = 'false';
      if(is_from_external_chat == "true"){
        jQuery("body").html('<div style="position: fixed;bottom: 0;right: 0;border: 1px solid #ccc;"><div style="position:absolute;top:0px;width: 100%;height: 40px;background-color: #F4F4F9;z-index: 99;box-shadow: 0px 2px 1px #ccc;text-align:right;"><a id="extChatMinimize" title="Minimize" style="margin-right:15px;display:inline-block;font-size: 30px;color: #777;text-decoration:none;cursor:pointer">-</a></div><div style="background-color: #ffffff; position: relative !important;text-align: center;padding: 40px 20px;"><a id="extChatLogin" style="font-weight:normal;text-decoration:none;color:#1a6ebd;margin-top:20px;margin-bottom:10px;font-size: 13px;font-family: Verdana;display: inline-block;cursor:pointer">Please log in to the application </a></div></div>');// No I18N
        jQuery("body").find("#extChatLogin").off("click.extChat").on("click.extChat",function(){// No I18N
            openLoginWindow();
        });
        jQuery("body").find("#extChatMinimize").off("click.extChat").on("click.extChat",function(){// No I18N
            minimizeChatbar();
        });
        window.top.postMessage((typeof sdpToJSON != 'undefined') ? sdpToJSON({"type" : "setExternalIframe","height":"150px", "width":"250px"}) : JSON.stringify({"type" : "setExternalIframe","height":"150px", "width":"250px"}),origin);// No I18N
      }
    }

  function openLoginWindow(){
    var sdpLoginUrl = "/externalCommFrame.do?origin="+origin+"&is_from_external_chat_login=true"; //No I18N
    window.open(sdpLoginUrl,'','width=800,height=800,toolbar=0,menubar=0,location=0,status=0,scrollbars=1,resizable=0,left=0,top=0');
    return false;
  }
  function minimizeChatbar(){
    window.top.postMessage((typeof sdpToJSON != 'undefined') ? sdpToJSON({"type" : "minimizeContent"}) : JSON.stringify({"type" : "minimizeContent"}),origin);// No I18N
  }

  /*SD-103525 issue fix. Here we utilized the BroadcastChannel to automatically refresh the page when the user switches to this tab, after logged in from another tab.*/
    var sd_broadcast_channel = new BroadcastChannel('sd_broadcast_channel'); //No I18N

    sd_broadcast_channel.onmessage = function( event )
    {
        if ( event.data === 'login' )
        {
            window.addEventListener('focus', function( event )
            {
            	window.location.reload();
            });
        }
    };

	/*SD-103525 issue fix. Here we utilized the BroadcastChannel to notify other tabs while logout.*/
	sd_broadcast_channel.postMessage('logout'); //No I18N
    </script>

         function checkServerStarted() {

                 if(isServerStarted) {
                     if($('#loading-form').length > 0) {
                         window.location.reload();
                     }
                     return;
                 }
                 else {
                     checkServerStarted();
                 }
             }, 1000);

             checkServerStarted();
